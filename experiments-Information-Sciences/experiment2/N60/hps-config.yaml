# Scalability sweep (N=60 HPS) -- generated by benchmarks/gen_configs.py
data_path: exp2/N60/data/mmlupro-train.pkl
models_directory: defense-models
output_file: exp2/N60/hps/hps-results.json
algorithm:
  validation_split_ratio: 0.3
  epsilon: 1.0e-09
  split_seed: 42
  gaussian_seed: 42
  max_debates: null
  feature_key: st_embedding
  save_final_models_dir: null
optuna:
  n_trials: 10
  sampler_seed: 42
  timeout: null
  early_stopping_patience: 5
  early_stopping_min_improvement_pct: 1
training:
  n_epochs_lr_reduce: 5
  lr_reduce_improvement_pct: 0.5
  lr_reduce_factor: 0.5
  min_lr: 1.0e-06
  n_epochs_early_stop: 12
  early_stop_improvement_pct: 0.5
models:
  PREM:
    seed: 42
    device: null
    input_dim: 384
    emb_dim:
    - 64
    - 128
    - 256
    alpha:
    - 0.5
    - 1.0
    gamma:
    - 0.5
    - 1.0
    prop_steps: 2
    num_epochs: 20
    batch_size: 256
    val_split: 0.2
    learning_rate:
    - 0.0001
    - 0.001
    weight_decay: 0.0001
    top_k: 18
    topologies: null
  CASPIAN:
    seed: 42
    device: null
    top_k: 18
    base_weight:
    - 0.1
    - 0.2
    - 0.4
    reciprocity_weight:
    - 0.1
    - 0.2
    cluster_weight: 1.0
    persistence_weight:
    - 0.4
    - 0.8
    pair_weight:
    - 0.5
    - 1.0
    - 1.5
    deviation_weight: 0.3
    topologies: null
