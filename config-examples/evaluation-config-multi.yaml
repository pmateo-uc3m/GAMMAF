# Evaluation config -- multi-dataset validation test (standard mode)
# Trains XG-Guard on the combined multi-dataset pickle and evaluates it
# separately on each configured dataset tag, saving per-dataset results.

models_directory: defense-models
output_file: tests/multi-dataset/results/summary.json
train_pkl_path: tests/multi-dataset/multi-train-test.pkl

# When the HPS search has been run beforehand, its per-tag index pickles in
# this directory are automatically excluded from evaluation (train ∪ HPS).
hps_index_pkl_dir: tests/multi-dataset/hps

defense_model_train_configs:
  XG-Guard:
    pkl_train: tests/multi-dataset/multi-train-test.pkl
    seed: 42
    device: cpu

    feat_dim_s: 384
    feat_dim_t: 384
    hidden_dim: 256
    batch_size: 4
    val_split: 0.2
    num_epochs: 2
    learning_rate: 0.001
    weight_decay: 0.0001
    alpha: 0.5
    top_k: 2
    topologies: null

# Per-dataset evaluation entries. Each tag is evaluated separately and its
# results are stored under <output_dir>/<tag>/<model>.json.  The selected
# indexes exclude the training indexes stored in the training pickle for the
# same tag (leakage-safe selection).
eval_datasets:
  - tag: MMLUPRO
    num_questions: 1
    n_questions_on_random_topo: 1
    questions_random_seed: 111

  - tag: InjecAgent
    ma_dataset_path: TA/TA-generation/output/TA_dataset.json
    num_questions: 1
    n_questions_on_random_topo: 1
    questions_random_seed: 121

  - tag: MsMarco
    ma_dataset_path: MA/Task_generation/output/msmarco_contaminated_benchmark.json
    num_questions: 1
    n_questions_on_random_topo: 1
    questions_random_seed: 131

  - tag: gsm8k
    num_questions: 1
    n_questions_on_random_topo: 1
    questions_random_seed: 141

live_evaluation_config:
  timeout: 120
  prompts_file: prompts/prompts_blindguard.json

  # Question loader
  questions_path: DatasetManager.py

  # Debate + attacker settings
  llm_max_retries: 3
  num_agents: 5
  num_malicious_agents: 2
  malicious_seed: 123
  max_rounds: 3
  consensus_threshold: 1.0
  no_consensus_check: false
  check_consensus_only_unflagged: true

  # Defense settings
  top_k_defense: 2
  no_defense_baseline: false

  # Concurrency
  max_concurrent_inference: 30

  # Questions (used as defaults when an eval_datasets entry omits them)
  num_questions: 1
  new_random_each_question: true
  n_questions_on_random_topo: 1
  topologies_seed: 24
  density_range_for_random_topo: [0.3, 0.7]

  # Text processor
  text_processor_path: TextProcessingManager.py
  text_processor_class_name: RoundProcessor

  # Debug artifacts
  save_traces: false
  clean_debates_with_empty_responses: false
