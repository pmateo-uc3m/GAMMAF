# Generation pipeline config (TrainDataGeneration.py)
# Loaded and validated by GenerationConfigCheck.py.

llm:
  timeout: 20
  llm_max_retries: 3
  max_concurrent_inference: 30

debate:
  num_agents: 5
  num_malicious_agents: 0
  malicious_seed: 3
  max_rounds: 3
  consensus_threshold: 1.0
  random_topo_seed: 24
  density_range_for_random_topo: [0.3, 0.7]
  # Alternative to a density range: keep the average number of neighbours per
  # node fixed. Used only when `density_range_for_random_topo` is absent or null
  # (density wins when both are set). density = average_neighbors / (num_agents - 1).
  # average_neighbors: 4

datasets:
  - tag: MMLU
    loader_tag: null
    num_questions: 10
    num_questions_on_random_topo: 10
    questions_random_seed: 1
    ma_dataset_path: null
    prompts_file: null # Overrides the loader's PROMPTS_FILE when set
    # Optional: run on topologies loaded from a JSON list of
    # {"name": <unique string>, "topology": <square 0/1 adjacency list of lists>}
    # entries instead of the generated chain/star/tree (+random) set.
    # `num_questions_loaded_topo` is then required and applies to every loaded
    # topology; each matrix side must equal debate.num_agents.
    # load_topology_file: null
    # num_questions_loaded_topo: null

  # The same loader can be run again with a different tag and config; both
  # runs are generated and saved under their own tag:
  # - tag: MMLU_alt
  #   loader_tag: MMLU
  #   num_questions: 10
  #   num_questions_on_random_topo: 10
  #   questions_random_seed: 7
  #   prompts_file: prompts/prompts_MMLU_alt.json

output_dir: data
output_file: test_data.pkl

# Optional post-processing
process_text: true
clean_debates: true
text_process_workers: 0
text_processor_path: TextProcessingManager.py
text_processor_class_name: RoundProcessor
text_processor_kwargs: {}
text_processor_device: null

verbose: false
