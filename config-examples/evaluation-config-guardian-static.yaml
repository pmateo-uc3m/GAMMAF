# Guardian (static DOMINANT) evaluation example. Use the default entry point:
#   python MainEvaluation.py config-examples/evaluation-config-guardian-static.yaml
#
# The module key below ('Guardian-static') must match the file stem of
# defense-models/Guardian-static.py.
models_directory: defense-models
output_file: results/guardian-static.json
train_pkl_path: data/train-gpt-oss-300.pkl
defense_model_train_configs:
  Guardian-static:
    seed: 42
    device: cuda
    input_dim: 384
    hidden_dim: 128
    num_gnn_layers: 2
    dropout: 0.0
    alpha: 0.3
    batch_size: 32
    num_epochs: 40
    val_split: 0.2
    lr_patience: 5
    lr_factor: 0.5
    early_stop: 10
    learning_rate: 0.001
    weight_decay: 0.0001
    remove_count: 2

live_evaluation_config:
  timeout: 60
  questions_path: DatasetManager.py
  questions_dataset_tag: MMLUPRO
  questions_random_seed: 28
  llm_max_retries: 3
  num_agents: 8
  num_malicious_agents: 2
  malicious_seed: 123
  max_rounds: 3
  consensus_threshold: 1.0
  no_consensus_check: false
  check_consensus_only_unflagged: true
  top_k_defense: 1
  no_defense_baseline: false
  max_concurrent_inference: 150
  num_questions: 0
  new_random_each_question: true
  n_questions_on_random_topo: 50
  topologies_seed: 24
  density_range_for_random_topo: [0.4, 0.9]
  text_processor_path: TextProcessingManager.py
  text_processor_class_name: RoundProcessor
  clean_debates_with_empty_responses: true
