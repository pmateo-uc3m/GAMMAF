# Pilot config (pipeline smoke test) - based on generation-config-TA.yaml
timeout: 120
parallel_questions: 50
llm_max_retries: 3

dataset_tag: TA
ma_dataset_path: TA/TA-generation/output/TA_dataset.json
questions_random_seed: 43522
verbose: false

# Output
save_data_dir: TA-tests/pilot-01
file_name: TA-att-pilot.pkl

# Optional post-processing
process_text: false
clean_data: false
text_process_workers: 0

# Debate parameters
debate_config:
  num_agents: 8
  num_malicious: 2
  max_rounds: 3
  consensus_threshold: 1.0
  malicious_randomization_seed: 32

  n_questions: 2
  n_questions_random_topo: 2

  random_topo_seed: 2446
  density:
    min: 0.45
    max: 0.9
