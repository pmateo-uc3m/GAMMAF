# Main evaluation config for the communication-only CASPIAN defense.
models_directory: defense-models
output_file: results/test-caspian.json
train_pkl_path: data/train-gpt-oss-300.pkl

defense_model_train_configs:
  CASPIAN:
    # CASPIAN is online and training-free. The path is retained by the
    # framework's common configuration contract but is not read by CASPIAN.
    pkl_train: data/train-gpt-oss-300.pkl
    epsilon: 1.0e-8
    target_ema_decay: 0.8
    influence_ema_decay: 0.8
    max_persistence_window: 64
    spine_top_k: 3
    top_k: 2

live_evaluation_config:
  timeout: 20
  prompts_file: prompts/prompts_blindguard.json
  questions_path: DatasetManager.py
  questions_dataset_tag: MMLU
  questions_random_seed: 28
  llm_max_retries: 3
  num_agents: 5
  num_malicious_agents: 2
  malicious_seed: 123
  max_rounds: 3
  consensus_threshold: 1.0
  no_consensus_check: false
  check_consensus_only_unflagged: true
  top_k_defense: 2
  no_defense_baseline: false
  max_concurrent_inference: 150
  num_questions: 20
  new_random_each_question: true
  n_questions_on_random_topo: 20
  topologies_seed: 24
  density_range_for_random_topo: [0.3, 0.7]
  text_processor_path: TextProcessingManager.py
  text_processor_class_name: RoundProcessor
  save_traces: false
  clean_debates_with_empty_responses: true
