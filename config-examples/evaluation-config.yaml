# Main evaluation config (MainEvaluation.py)
# Loaded and validated by EvaluationConfigCheck.py.

models_directory: defense-models
output_file: results/test.json
train_pkl_path: data/train-gpt-oss-300.pkl

llm:
  timeout: 20
  llm_max_retries: 3
  max_concurrent_inference: 150

debate:
  num_agents: 5
  num_malicious_agents: 2
  malicious_seed: 123
  max_rounds: 3
  consensus_threshold: 1.0
  check_consensus_only_unflagged: true
  no_consensus_check: false
  new_random_each_question: true
  random_topo_seed: 24
  density_range_for_random_topo: [0.3, 0.7]
  # Drop debates in which some agent emitted a response with both <answer> and
  # <message> empty (tool-call responses, e.g. TA, are always kept).
  clean_debates: false

datasets:
  - tag: MMLU
    loader_tag: null
    num_questions: 20
    num_questions_on_random_topo: 20
    questions_random_seed: 28
    ma_dataset_path: null
    prompts_file: null # Overrides the loader's PROMPTS_FILE when set
    hps_indexes: null

  # The same loader can be evaluated again with a different tag and config;
  # both runs are evaluated and saved under their own tag:
  # - tag: MMLU_alt
  #   loader_tag: MMLU
  #   num_questions: 20
  #   num_questions_on_random_topo: 20
  #   questions_random_seed: 7
  #   prompts_file: prompts/prompts_MMLU_alt.json

evaluation:
  questions_path: DatasetManager.py
  questions_class_name: null
  python_seed: 28
  numpy_seed: 28
  answer_seed: 28
  top_k_defense: 2
  no_defense_baseline: true
  save_traces: false
  debug_mode: false
  static_adjacency_mode: false
  topologies_file: null
  topologies_from_pkl: null

text_processor_path: TextProcessingManager.py
text_processor_class_name: RoundProcessor
text_processor_kwargs: {}
text_processor_device: cpu

# Hyperparameter search is a separate pipeline; see
# config-examples/hyperparameter-search-config.yaml (HyperParameterSearch.py).

# Global model-training defaults, applied to every defense model unless its
# own section overrides a key. `n_epochs_early_stop` is intentionally larger
# than `n_epochs_lr_reduce` so the LR reduction gets a chance to help before
# training is stopped.
training:
  n_epochs_lr_reduce: 5            # epochs without >= threshold % improvement -> LR reduction
  lr_reduce_improvement_pct: 1.0   # % validation-loss improvement that counts as progress
  lr_reduce_factor: 0.5            # LR multiplier applied on an LR reduction
  min_lr: 1.0e-6                   # LR floor
  n_epochs_early_stop: 12          # epochs without >= threshold % improvement -> stop training
  early_stop_improvement_pct: 1.0  # % validation-loss improvement that resets the early-stop counter

# One config section per defense model file in models_directory (file stem must match).
# Any `training` key above can also be set inside a model section to override
# the global value for that model only.
defense_model_train_configs:
  BlindGuard:
    pkl_train: data/train-gpt-oss-300.pkl # Path to the pkl with the training data
    seed: 42
    device: cpu # Device for model training
    # Data perturbation (used to simulate anomalies in training)
    anomaly_rate: 0.2
    anomaly_scale: 0.5
    anomalize_data: true
    no_balance: false # Set to true to disable class balancing before training
    # Training hyperparameters
    input_dim: 1152
    hidden_dim: 256
    emb_dim: 128
    batch_size: 256
    val_split: 0.2
    num_epochs: 20
    temperature: 0.07
    learning_rate: 0.001
    weight_decay: 0.0001
    top_k: 2
    topologies: null

  XG-Guard:
    pkl_train: data/train-gpt-oss-300.pkl
    seed: 42
    device: cpu
    # Training hyperparameters
    feat_dim_s: 384
    feat_dim_t: 384
    hidden_dim: 256
    batch_size: 8
    val_split: 0.2
    num_epochs: 25
    learning_rate: 0.001
    weight_decay: 0.0001
    alpha: 0.5
    top_k: 2
    topologies: null
