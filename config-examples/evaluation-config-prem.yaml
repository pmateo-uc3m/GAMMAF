# PREM evaluation config (MainEvaluation.py)
models_directory: defense-models # Directory that contains all the defense models that are going to be benchmarked
output_file: results/test-prem.json # json file where the evaluation results will be saved
train_pkl_path: data/train-gpt-oss-300.pkl

# One config section per defense model file in models_directory (file stem must match)
defense_model_train_configs:
  PREM:
    pkl_train: data/train-gpt-oss-300.pkl # Path to the pkl with the training data
    seed: 42
    device: cuda # Device for model training

    # PREM hyperparameters (from the paper / PREM.py)
    input_dim: 384      # sentence-embedding (node feature) dimension
    emb_dim: 128        # ego/neighbor embedding dimension d_h
    prop_steps: 2       # anonymized message-passing steps k
    batch_size: 256     # mini-batch size (-1 = full batch)
    val_split: 0.2
    num_epochs: 100
    learning_rate: 0.0003
    weight_decay: 0.0
    alpha: 0.9          # trade-off for neighbor-based negative term
    gamma: 0.1          # trade-off for ego-based negative term
    top_k: 2

    topologies: null

  PREM-v2:
    pkl_train: data/train-gpt-oss-300.pkl # Path to the pkl with the training data
    seed: 42
    device: cuda # Device for model training

    # PREM-v2 hyperparameters (mean-aggregation variant / PREM-v2.py)
    input_dim: 384      # sentence-embedding (node feature) dimension
    emb_dim: 128        # ego/neighbor embedding dimension d_h
    prop_steps: 2       # anonymized message-passing steps k
    batch_size: 256     # mini-batch size (-1 = full batch)
    val_split: 0.2
    num_epochs: 100
    learning_rate: 0.0003
    weight_decay: 0.0
    alpha: 0.9          # trade-off for neighbor-based negative term
    gamma: 0.1          # trade-off for ego-based negative term
    top_k: 2

    topologies: null

live_evaluation_config:
  timeout: 20 # Added a default value
  prompts_file: prompts/prompts_blindguard.json # Added a path

  # Question loader
  questions_path: DatasetManager.py
  questions_dataset_tag: MMLU
  questions_random_seed: 28

  # Debate + attacker settings
  llm_max_retries: 3
  num_agents: 5
  num_malicious_agents: 2
  malicious_seed: 123
  max_rounds: 3
  consensus_threshold: 1.0
  no_consensus_check: false
  check_consensus_only_unflagged: true

  # Defense settings
  top_k_defense: 2
  no_defense_baseline: true

  # Concurrency
  max_concurrent_inference: 150 # Added a default value

  # Questions
  num_questions: 50
  new_random_each_question: true
  n_questions_on_random_topo: 50
  topologies_seed: 24
  density_range_for_random_topo: [0.3, 0.7]

  # Text processor
  text_processor_path: TextProcessingManager.py
  text_processor_class_name: RoundProcessor

  # Debug artifacts
  save_traces: false
  clean_debates_with_empty_responses: true
