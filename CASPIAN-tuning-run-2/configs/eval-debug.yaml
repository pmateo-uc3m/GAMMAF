# Debug evaluation: small sample, debug logs enabled, adapted baseline CASPIAN.
models_directory: defense-models
output_file: CASPIAN-tuning-run-2/results/debug-eval.json
train_pkl_path: CASPIAN-tuning-run-2/data/train-mmlupro-200.pkl

defense_model_train_configs:
  CASPIAN:
    pkl_train: CASPIAN-tuning-run-2/data/train-mmlupro-200.pkl
    epsilon: 1.0e-8
    target_ema_decay: 0.5
    influence_ema_decay: 0.5
    max_persistence_window: 64
    spine_top_k: 3
    top_k: 2

live_evaluation_config:
  timeout: 60
  prompts_file: prompts/prompts_blindguard.json

  questions_path: DatasetManager.py
  questions_dataset_tag: MMLUPro
  questions_random_seed: 28

  llm_max_retries: 3
  num_agents: 8
  num_malicious_agents: 2
  malicious_seed: 123
  max_rounds: 3
  consensus_threshold: 1.0
  no_consensus_check: false
  check_consensus_only_unflagged: true

  top_k_defense: 2
  no_defense_baseline: false

  max_concurrent_inference: 150

  num_questions: 12
  new_random_each_question: true
  n_questions_on_random_topo: 12
  topologies_seed: 24
  density_range_for_random_topo: [0.5, 0.9]

  text_processor_path: TextProcessingManager.py
  text_processor_class_name: RoundProcessor

  save_traces: false
  clean_debates_with_empty_responses: true
  debug_mode: true
