# Realistic TA dataset, arm A: operational-instruction injection.
arm: operational

input:
  # Already-enriched dataset (provides benign responses, tool descriptions and
  # source_entry_index); never modified.
  enriched_dataset: "TA/TA-generation/output/TA_dataset.json"
  raw_dataset: "TA/TA-generation/combined-injecAgent-entries.json"

output:
  path: "TA/TA-generation/output/TA_dataset_operational.json"

llm:
  settings_file: "TA/TA-generation/llm_settings_realistic.yaml"
  structured_output_method: "json_mode"

generation:
  max_retries: 3
  concurrency: 100
