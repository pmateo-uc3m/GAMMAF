# Smoke-test generation config: MMLUPro, 8 agents, 0 malicious, 1 question/topology.
# Purpose: measure vLLM throughput before the full generation run.

timeout: 120
parallel_questions: 12
llm_max_retries: 3

dataset_tag: MMLUPro
questions_random_seed: 500
verbose: false

# Output
save_data_dir: CASPIAN-tests/data
file_name: smoke-MMLUPro-8a-0m.pkl

# Post-processing
process_text: false
clean_data: true
text_process_workers: 0

# Debate parameters
debate_config:
  num_agents: 8
  num_malicious: 0
  max_rounds: 3
  consensus_threshold: 1.0
  malicious_randomization_seed: 3

  n_questions: 1
  n_questions_random_topo: 0

  random_topo_seed: 24
  density:
    min: 0.3
    max: 0.7
